<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Recriação</title>
    <link rel = "stylesheet" href = "style.css" >
</head>

<!-- WHAPPER -->
<body>
    <div id = "wrapper">
        

        <!-- CONTAINER -->
        <div id = "container">



            <!-- LEFT AREA -->
            <div class="column left">
                <div class = "main"></div>
            </div>




            <!-- RIGHT AREA -->
            <div class="column right">


                <div class="login-panel">

                    <div class= "log">
                        <h1>Log into instagram</h1>
                    </div>

                    <form>
                        <input placeholder="Mobile number, username or email" type ="text" name="username" />
                        <input placeholder="Password" type="password" name="password" />
                        <input class="login" type="submit" value="Log in" />
                        <input class="forgot" type="submit" value="Forgot Password?" />

                        <input class="create" type="submit" value="Create new account" />
                    </form>
                </div>

                <div class= "meta-logo"> 
                    <img src="assets/Meta-Logo.png">
                </div>


                </div>

            </div>







        </div>
    </div>
    

</body>
</html>
